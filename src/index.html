<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style/output.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <!-- Thin -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/thin/style.css" />

    <!-- Light -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" />

    <!-- Regular -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />

    <!-- Bold -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css" />

    <!-- Fill -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />

    <!-- Duotone -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/duotone/style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <nav class="w-full flex justify-between items-center py-5 px-11 bg-white border-b-2 border-light-gray">
      <div class="flex flex-1">
        <img src="/src/image/Airbnb_Logo_Bélo.svg" alt="logo" class="w-26" />
      </div>
      <!-- Logo end-->
      <div class="flex flex-2 justify-center">
        <div
          class="flex pl-4 pr-2 py-1.5 border-2 border-light-gray shadow-sm shadow-blur rounded-full items-center text-sm font-heading font-bold hover:shadow-lg duration-100"
        >
          <div class="flex items-center border-r-2 border-light-gray h-8 cursor-pointer">
            <div><img src="/src/image/Anywhere.png" class="w-8" alt="Anywhere" /></div>
            <a class="flex items-center pr-4 pl-2">Anywhere</a>
          </div>
          <div class="h-8 flex items-center border-r-2 border-light-gray cursor-pointer">
            <div><a class="pl-4 pr-4">Anytime</a></div>
          </div>
          <div class="pl-4 pr-4 cursor-pointer"><a>Add guests</a></div>
          <div class="pr-0.4 py-2 w-8 h-8 rounded-full flex items-center justify-center bg-dark-pink text-white cursor-pointer">
            <i class="ph-bold ph-magnifying-glass"></i>
          </div>
        </div>
      </div>
      <!-- navigation item end-->

      <div class="flex flex-1 items-center justify-end gap-2.5">
        <!--- Become a host --->
        <button class="py-2 px-4 rounded-full hover:bg-white-2 font-medium text-heading duration-100 cursor-pointer text-black-1">
          Become a host
        </button>
        <!--- Become a host end--->
        <div class="flex items-center justify-center cursor-pointer w-10 h-10 rounded-full bg-white-1 hover:bg-light-gray-1 text-xl duration-100">
          <i class="ph ph-globe"></i>
        </div>
        <!--- Language Globe --->

        <!--- Language Globe end--->

        <!--- Hamburger --->
        <div class="flex items-center justify-center cursor-pointer w-10 h-10 rounded-full bg-white-1 hover:bg-light-gray-1 text-xl duration-100">
          <i class="ph ph-list"></i>
        </div>
        <!--- Hamburger end--->
      </div>
      <!-- globe & menu-->
    </nav>

    <!---- Property title and images --->
    <div class="flex flex-col px-20 max-w-[1280px] mx-auto">
      <!--- title and share controles---->
      <div class="w-full flex items-center pt-4">
        <div class="flex-1"><p class="font-bold text-2xl font-heading">Villa Mehfil | 3BR Private Pool, Bar & Garden</p></div>
        <!---Share button-->
        <button
          class="flex items-center justify-center space-x-1.5 text-black-1 p-2 cursor-pointer hover:text-black hover:bg-white-2 rounded-lg duration-100"
        >
          <div class="flex items-center text-xl pt-1 opacity-90"><i class="ph ph-export"></i></div>
          <div class="underline font-bold font-heading text-sm"><a>Share</a></div>
        </button>
        <!---Save button-->
        <button
          class="flex items-center justify-center space-x-1.5 text-black-1 p-2 cursor-pointer hover:text-black hover:bg-white-2 rounded-lg duration-100"
        >
          <div class="flex items-center text-xl pt-1 opacity-90"><i class="ph ph-heart"></i></div>
          <div class="underline font-bold font-heading text-sm"><a>Save</a></div>
        </button>
      </div>
      <!------ title and share controles end ------------>

      <!---- Property images ---->
      <div class="relative w-full h-[520px] pt-5">
        <div class="w-full h-full grid grid-cols-[2fr_1fr_1fr] grid-rows-2 gap-2 rounded-xl overflow-hidden">
          <div class="row-span-2 relative group cursor-pointer overflow-hidden">
            <img src="image/1.avif" alt="image_1" class="h-full w-full object-cover" />
            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition duration-100"></div>
          </div>
          <div class="relative group cursor-pointer overflow-hidden">
            <img src="image/2.avif" alt="image_2" class="h-full w-full object-cover" />
            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition duration-100"></div>
          </div>
          <div class="relative group cursor-pointer overflow-hidden">
            <img src="image/3.avif" alt="image_3" class="h-full w-full object-cover" />
            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition duration-100"></div>
          </div>
          <div class="relative group cursor-pointer overflow-hidden">
            <img src="image/4.avif" alt="image_4" class="h-full w-full object-cover" />
            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition duration-100"></div>
          </div>
          <div class="relative group cursor-pointer overflow-hidden">
            <img src="image/5.avif" alt="image_5" class="h-full w-full object-cover" />
            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition duration-100"></div>
          </div>
        </div>
        <!---Show all photos button -->

        <button
          class="absolute bottom-7 right-7 flex gap-1 items-center justify-center px-4 py-1 rounded-lg bg-white-1 hover:bg-light-gray color-light-gray cursor-pointer"
        >
          <div class="text-xl"><i class="ph-bold ph-dots-nine"></i></div>
          <p class="text-sm font-medium">Show all photos</p>
        </button>

        <!---Show all photos button end-->
      </div>
      <!---- Property images end ---->
    </div>

    <!---- Property title and images end--->


    <!----- Proeperty details and pricing --------------------------------------------->
    <div class="flex max-w-[1280px] mx-auto px-20">
    <!---- Property details -------------------------->  
    <div class="flex flex-2 py-6">
      <div class="flex flex-col ">
        <p class="font-bold text-xl font-heading text-black-1">Entire home in Lonavala, India</p>
        <p class="flex items-center gap-1 font-heading">8 guests <span>·</span> 3 bedrooms <span>·</span> 3 beds <span>·</span> 4 bathrooms</p>
      </div>
    </div>`
    <!---Property details end------------------------->
    
    <!---- Pricing section --------------------------->
    <div class="flex flex-1">
      <p>Pricing section</p>
    </div>
    <!---- Pricing section end ----------------------->
    </div>
    <!----- Proeperty details and pricing end-------------------------------------------->



  </body>
</html>
